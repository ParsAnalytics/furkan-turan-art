<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background Warm Card -->
  <rect width="400" height="400" rx="24" fill="#EDE0CE" />
  
  <!-- Abstract Minimalist Composition (Zen Art Style) -->
  <!-- Terracotta Sun/Circle -->
  <circle cx="200" cy="180" r="85" fill="#C05835" opacity="0.85" />
  
  <!-- Rose Crescent/Leaf Shape -->
  <path d="M 120,240 C 120,160 220,120 280,180 C 220,220 180,300 120,240 Z" fill="#B87478" opacity="0.9" />
  
  <!-- Sage Green Accent Shape -->
  <circle cx="260" cy="250" r="30" fill="#8AA882" opacity="0.8" />

  <!-- Elegant Painterly Brush Stroke (Minimalist Silhouette Path) -->
  <path d="M 150,300 C 170,250 200,200 230,220 C 260,240 230,280 200,320 C 180,300 160,310 150,300 Z" fill="#2C1A10" opacity="0.15" />
  
  <!-- Minimalist Fine Line Portrait Silhouette (Stylized Ink Drawing) -->
  <path d="M 160,260 
           C 160,200 190,160 210,130 
           C 220,110 230,90 225,80 
           C 220,70 205,80 195,95 
           C 180,115 165,150 165,180
           C 165,210 180,240 210,270" 
        fill="none" 
        stroke="#2C1A10" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Fluid Line representing creativity -->
  <path d="M 100,280 C 150,330 250,290 300,310" 
        fill="none" 
        stroke="#2C1A10" 
        stroke-width="2" 
        stroke-dasharray="4 4" 
        stroke-linecap="round" />
</svg>
