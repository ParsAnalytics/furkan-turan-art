<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background (Warm Beige) -->
  <rect width="400" height="400" rx="24" fill="#F5EDE0" />
  
  <!-- Subtle circular texture/accent in the background -->
  <circle cx="200" cy="200" r="160" fill="#EDE0CE" opacity="0.6" />
  
  <!-- The Beautiful Canvas/Tablo (Minimalist Easel + Art Frame) -->
  <!-- Easel Legs (Dark Ink) -->
  <line x1="150" y1="130" x2="110" y2="340" stroke="#2C1A10" stroke-width="4" stroke-linecap="round" />
  <line x1="250" y1="130" x2="290" y2="340" stroke="#2C1A10" stroke-width="4" stroke-linecap="round" />
  <line x1="200" y1="100" x2="200" y2="340" stroke="#2C1A10" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  
  <!-- Easel Shelf Support -->
  <line x1="100" y1="280" x2="300" y2="280" stroke="#2C1A10" stroke-width="6" stroke-linecap="round" />

  <!-- The Canvas Frame -->
  <rect x="120" y="110" width="160" height="160" rx="4" fill="#FAF5EC" stroke="#2C1A10" stroke-width="3" />
  
  <!-- The Beautiful Painting inside the Canvas (Terracotta & Rose Zen Landscape) -->
  <clipPath id="canvasClip">
    <rect x="122" y="112" width="156" height="156" rx="2" />
  </clipPath>
  
  <g clip-path="url(#canvasClip)">
    <!-- Soft Rose mountains/curves -->
    <path d="M 110,230 C 140,190 170,210 210,180 C 240,160 260,190 290,170 L 290,280 L 110,280 Z" fill="#EDD5D5" />
    <path d="M 110,260 C 150,220 180,240 230,210 C 260,195 270,220 290,200 L 290,280 L 110,280 Z" fill="#B87478" opacity="0.85" />
    <!-- Terracotta Rising Sun -->
    <circle cx="220" cy="160" r="32" fill="#C05835" />
    <!-- Sage Green organic path/water -->
    <path d="M 120,268 C 170,250 210,280 280,260 L 280,280 L 120,280 Z" fill="#8AA882" opacity="0.7" />
  </g>

  <!-- Symbolic Painter Silhouette (Ressam) -->
  <!-- Painter's Body/Shoulder (Sleek abstract curve) -->
  <path d="M 60,360 C 60,290 90,260 120,260 C 130,270 140,295 140,320 L 110,360 Z" fill="#2C1A10" opacity="0.9" />
  <!-- Head/Mind (Circular form above shoulder) -->
  <circle cx="100" cy="225" r="22" fill="#2C1A10" />
  
  <!-- Painter's Arm and Hand holding Brush -->
  <!-- Arm reaching towards the canvas -->
  <path d="M 115,270 C 135,260 160,250 185,220" fill="none" stroke="#2C1A10" stroke-width="3.5" stroke-linecap="round" />
  <!-- The Paint Brush (Ink handle, terracotta tip) -->
  <line x1="185" y1="220" x2="200" y2="200" stroke="#5C3A28" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 198,203 C 197,200 200,194 204,196 C 206,198 203,204 198,203 Z" fill="#C05835" />
  
  <!-- Fluid brush strokes/energy lines indicating active painting -->
  <path d="M 190,180 C 180,160 195,140 185,120" fill="none" stroke="#B87478" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
